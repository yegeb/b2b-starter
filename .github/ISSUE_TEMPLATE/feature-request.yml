name: Feature request
description: Propose a feature or improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: Explain the need and who benefits.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the intended behavior and any relevant alternatives.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe how we will know the work is complete.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Link related issues or include other useful details.
