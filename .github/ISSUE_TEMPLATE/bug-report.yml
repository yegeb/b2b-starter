name: Bug report
description: Report a reproducible problem.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and its impact. Do not include secrets.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant environment and context
      description: Include versions, logs, or screenshots if useful; remove sensitive information.
