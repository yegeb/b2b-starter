name: Pull request checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test repository guards
        run: python3 -m unittest discover -s tests -p test_agent_guards.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the backend
        run: pnpm --filter @b2b-starter/backend build
      - name: Type-check the storefront
        run: pnpm --filter @b2b-starter/storefront exec tsc --noEmit
      - name: Run the storefront and Admin UI tests
        run: pnpm test

  storefront-build:
    name: Storefront build regression check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: build_check
          POSTGRES_PASSWORD: build_check
          POSTGRES_DB: build_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U build_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - name: Build the storefront with the API unavailable and available
        env:
          # A service database server that exists only for this job. The check
          # creates and drops its own database on it.
          BUILD_CHECK_DATABASE_URL: postgres://build_check:build_check@localhost:5432/build_check
          BUILD_CHECK_OUTPUT_DIR: ${{ runner.temp }}/storefront-build-check
        run: node scripts/check-storefront-build.mjs
      - name: Upload build check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-build-check
          path: ${{ runner.temp }}/storefront-build-check
          if-no-files-found: ignore
